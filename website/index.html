<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F26522" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Taqon Electrico" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <link rel="manifest" href="/manifest.json" />
    <!-- Preconnect to Google Fonts (eliminates DNS+TLS round trips ~100-300ms) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Preload the font CSS so it loads in parallel with JS instead of blocking via @import -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Syne:wght@400;500;600;700;800&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Syne:wght@400;500;600;700;800&display=swap" />
    <title>Taqon Electrico — Zimbabwe's Premier Solar & Electrical Company</title>
    <meta name="description" content="Taqon Electrico provides professional solar installations, electrical maintenance, and renewable energy solutions in Harare, Zimbabwe. ZERA recommended solar company." />
    <!-- Social link preview (Open Graph + Twitter). These are the site-wide
         defaults seen by crawlers that don't run JS (WhatsApp, Facebook, X).
         Per-product and per-page images are injected at build time by
         scripts/prerender-og.mjs, and at runtime by the SEO component. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Taqon Electrico" />
    <meta property="og:title" content="Taqon Electrico — Zimbabwe's Premier Solar & Electrical Company" />
    <meta property="og:description" content="Professional solar installations, electrical maintenance, and renewable energy solutions in Zimbabwe. Get an automated quote with our Solar Advisor." />
    <meta property="og:url" content="https://www.taqon.co.zw/" />
    <meta property="og:image" content="https://www.taqon.co.zw/downloads/taqon-robot.jpeg" />
    <meta property="og:image:width" content="627" />
    <meta property="og:image:height" content="627" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Taqon Electrico — Zimbabwe's Premier Solar & Electrical Company" />
    <meta name="twitter:description" content="Professional solar installations and renewable energy solutions in Zimbabwe. Get an automated quote with our Solar Advisor." />
    <meta name="twitter:image" content="https://www.taqon.co.zw/downloads/taqon-robot.jpeg" />
    <meta name="keywords" content="solar Zimbabwe, solar installation Harare, Sunsynk Zimbabwe, Jinko Solar Zimbabwe, Pylontech Zimbabwe, Dyness, Sigenergy, Victron Energy Zimbabwe, Halsteds, Cafca, Electrosales, Flint Electrical, solar geyser, Suntask, Ecosolar, Solara, gas geyser, Powerite, inverters, batteries, solar panels" />
    <!-- Static brand/structured data so non-JS crawlers index the brands we
         stock even before the React app renders the homepage marquee. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Taqon Electrico",
      "url": "https://www.taqon.co.zw/",
      "logo": "https://www.taqon.co.zw/favicon.png",
      "image": "https://www.taqon.co.zw/downloads/taqon-robot.jpeg",
      "description": "Zimbabwe solar and electrical company — authorised supplier and installer of Sunsynk, Jinko Solar, Pylontech, Dyness, Sigenergy and Victron Energy solar equipment, plus solar and gas geyser installation. Trade partners include Halsteds, Cafca, Electrosales and Flint Electrical.",
      "areaServed": "Zimbabwe",
      "knowsAbout": ["Sunsynk", "Jinko Solar", "Pylontech", "Dyness", "Sigenergy", "Victron Energy", "Halsteds", "Cafca", "Electrosales", "Flint Electrical", "Solar installation", "Solar geysers", "Suntask", "Ecosolar", "Solara", "Gas geysers", "Powerite", "Inverters", "Batteries", "Solar panels"]
    }
    </script>
    <!-- iOS safety net: ensures a readable cream background before Tailwind
         loads, so older iPhones never show a black screen during load. -->
    <style>
      html, body { background-color: #FFFBF5; color: #1A1A1A; margin: 0; }
      #root { min-height: 100vh; background-color: #FFFBF5; }
    </style>
    <!-- Analytics: Uncomment to activate Plausible -->
    <!-- <script defer data-domain="taqon.co.zw" src="https://plausible.io/js/script.js"></script> -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script src="//code.tidio.co/ahsai9b3llw7yewkmi7fvnlkzimgpzaf.js" async></script>
  </body>
</html>
